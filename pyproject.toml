[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notebooklm-mcp"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for Google NotebookLM, with pluggable authentication."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "puneet-sharma-18" }]
keywords = ["mcp", "notebooklm", "google", "llm", "authentication"]

dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
oauth = [
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
notebooklm-mcp = "notebooklm_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notebooklm_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
