<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yapper</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23e5484d'/><path fill='white' d='M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a href="#/" class="brand"><span class="dot"></span>Yapper</a>
    <nav>
      <a href="#/" data-nav="list">Conversations</a>
      <a href="#/tasks" data-nav="tasks">Action items</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
  </header>
  <main id="app"><p class="muted">Loading…</p></main>

  <dialog id="login">
    <form method="dialog" id="login-form">
      <h2>Connect to Yapper</h2>
      <p class="muted">Enter the <code>YAPPER_TOKEN</code> from your server's <code>.env</code> file. It is stored only in this browser.</p>
      <input id="login-token" type="password" placeholder="Token" autocomplete="current-password" required>
      <button class="primary" type="submit">Connect</button>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
